# XIAO ESP32S3 Plus + Seeed RS485 Breakout Board on a Samsung AR12HSFSAWKNZE wall unit (2014, Wi-Fi kit SWL-B70F).
#
# F1/F2 bus (non-NASA, 9600 8E1, indoor 00, outdoor c8): climate, temperatures, power, errors.
#   F1->A, F2->B, CN51 pin4 (GND)->GND, CN51 pin5 (12V)->12V. 120R switch off.
#   Seeed RS485 Breakout: D5 = RO (ESP RX), D4 = DI (ESP TX), D2 = DE/RE.
#
# CN51 (Wi-Fi kit connector, 5 V UART, 9600 8N1): all control (the climate card included), presets,
# auto clean, air direction, counters. F1/F2 above is only read.
#   Pin 1 = AC RX, pin 2 = AC TX (confirmed 2026-10-03 by the AC answering).
#   AC TX (pin 2) -> 22k -> D3 (ESP RX), 33k D3->GND.
#   AC RX (pin 1) has a strong (~0.5k) pull-up: AO3400 drain -> 100R -> pin 1, source GND,
#   gate on D10 with 100k gate->GND. The MOSFET inverts, hence tx_pin inverted.
#   Protocol: ac-samsung-cn51.h.

esphome:
  name: ac-samsung
  friendly_name: AC Samsung
  includes:
    - ac-samsung-cn51.h
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            // All climate control goes out on CN51; F1/F2 is only read (a B0 there cancels quiet etc.).
            esphome::samsung_ac::nonnasa_request_sink = [](const esphome::samsung_ac::ProtocolRequest &r) {
              ac_cn51::apply_request(id(cn51), r, (uint8_t) id(good_sleep_half_hours));
            };
            ac_cn51::beep = id(beep_on);
            ac_cn51::handshake(id(cn51));

esp32:
  board: seeed_xiao_esp32_s3_plus
  framework:
    type: esp-idf

api:
  encryption:
    key: !secret api_key
  on_client_connected:
    - lambda: 'ac_cn51::notify_online(id(cn51), true);'

ota:
  - platform: esphome
    encryption:

logger:
  logs:
    component: ERROR

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  power_save_mode: NONE
  reboot_timeout: 60min

web_server:

uart:
  - id: rs485
    rx_pin: GPIO6 # D5
    tx_pin: GPIO5 # D4
    baud_rate: 9600
    parity: EVEN
  - id: cn51
    rx_pin: GPIO4 # D3
    tx_pin:
      number: GPIO9 # D10
      inverted: true
    baud_rate: 9600

interval:
  - interval: 20ms
    then:
      - lambda: |-
          ac_cn51::poll(id(cn51));
          ac_cn51::autoclean_tick(id(cn51));
          esphome::samsung_ac::nonnasa_altmode_source = ac_cn51::state.comode;
  # Heartbeat: the Wi-Fi/internet notify (AC answers 1405). Once acked, the AC only reports
  # changes, so silence alone means nothing; redo the handshake only if even this goes unanswered.
  - interval: 20s
    then:
      - lambda: |-
          if (millis() - ac_cn51::state.last_rx_ms > 60000) {
            ac_cn51::handshake(id(cn51));
          } else {
            ac_cn51::notify_online(id(cn51), true);
          }
  - interval: 5min
    then:
      - lambda: 'ac_cn51::request_counters(id(cn51));'

external_components:
  # Fork of omerfaruk-aran/esphome_samsung_hvac_bus: non-NASA control through a request sink (CN51),
  # F1/F2 read-only, presets shown from CN51.
  - source: github://andrei-marinache/esphome_samsung_hvac_bus@main
    components: [samsung_ac]

samsung_ac:
  uart_id: rs485
  flow_control_pin: GPIO3 # D2
  non_nasa_keepalive: true
  non_nasa_tx_delay_ms: 30
  debug_log_messages: false
  debug_log_undefined_messages: false
  capabilities:
    vertical_swing: true
    horizontal_swing: false
    # The remote's special modes, as presets. Values are the CN51 AC_FUN_COMODE codes; the
    # component's preset keys are only slots (longreach/eco/windfree are reused for other names).
    presets:
      sleep:
        enabled: true
        name: "Sleep"
        value: 0x42
      quiet:
        enabled: true
        name: "Quiet"
        value: 0x52
      fast:
        enabled: true
        name: "Fast"
        value: 0x22
      longreach:
        enabled: true
        name: "Comfort"
        value: 0x62
      eco:
        enabled: true
        name: "Single User"
        value: 0x32
      windfree:
        enabled: true
        name: "None"
        value: 0x12
  devices:
    - address: "00" # indoor unit
      climate:
        name: "Climate"
        id: clim
      power:
        name: "Power"
      mode:
        name: "Mode"
      target_temperature:
        name: "Target temperature"
      room_temperature:
        name: "Room temperature"
      indoor_eva_in_temperature:
        name: "Evaporator in"
      indoor_eva_out_temperature:
        name: "Evaporator out"
    - address: "c8" # outdoor unit
      outdoor_temperature:
        name: "Outdoor temperature"
      outdoor_instantaneous_power:
        name: "Power consumption"
      outdoor_current:
        name: "Current"
      outdoor_voltage:
        name: "Voltage"
      outdoor_cumulative_energy:
        name: "Energy"
      error_code:
        name: "Error code"
      # Non-NASA command F0 values, published by the component under these message ids.
      custom_sensor:
        - name: "Compressor frequency"
          message: 0xF007
          unit_of_measurement: Hz
          state_class: measurement
          accuracy_decimals: 0
        - name: "Compressor target frequency"
          message: 0xF006
          unit_of_measurement: Hz
          state_class: measurement
          accuracy_decimals: 0
        - name: "Compressor ordered frequency"
          message: 0xF005
          unit_of_measurement: Hz
          state_class: measurement
          accuracy_decimals: 0
        - name: "Outdoor fan"
          message: 0xF008
          state_class: measurement
          accuracy_decimals: 0
        - name: "Defrost"
          message: 0xF004
          type: binary

switch:
  # Beep for commands sent from here (HA); the remote keeps beeping.
  - platform: template
    name: "Beep on HA commands"
    icon: mdi:volume-high
    entity_category: config
    lambda: 'return id(beep_on);'
    turn_on_action:
      - lambda: 'id(beep_on) = true; ac_cn51::beep = true;'
    turn_off_action:
      - lambda: 'id(beep_on) = false; ac_cn51::beep = false;'
  - platform: template
    name: "Auto clean"
    icon: mdi:air-filter
    lambda: 'return ac_cn51::state.autoclean == 0x22;'
    turn_on_action:
      - lambda: 'ac_cn51::command(id(cn51), 0x13, 0x32, 0x22);'
    turn_off_action:
      - lambda: 'ac_cn51::command(id(cn51), 0x13, 0x32, 0x23);'

globals:
  - id: beep_on
    type: bool
    restore_value: true
    initial_value: 'true'
  # good'sleep off timer in half hours, used when good'sleep is chosen (the remote's default is 8 h).
  - id: good_sleep_half_hours
    type: int
    restore_value: true
    initial_value: '16'

select:
  # good'sleep turns the AC off after this time; same choices as the remote.
  - platform: template
    name: "good'sleep duration"
    icon: mdi:timer-outline
    update_interval: 2s
    options: ["0.5 h", "1 h", "2 h", "3 h", "4 h", "5 h", "6 h", "7 h", "8 h", "9 h", "10 h", "11 h", "12 h"]
    lambda: |-
      int half = ac_cn51::state.sleep > 0 ? ac_cn51::state.sleep : id(good_sleep_half_hours);
      if (half == 1)
        return std::string("0.5 h");
      return esphome::to_string(half / 2) + " h";
    set_action:
      - lambda: |-
          int half = x == "0.5 h" ? 1 : atoi(x.c_str()) * 2;
          id(good_sleep_half_hours) = half;
          if (ac_cn51::state.comode == ac_cn51::COMODE_GOOD_SLEEP)
            ac_cn51::command(id(cn51), 0x12, {0x44, 0x01, ac_cn51::COMODE_GOOD_SLEEP, 0x73, 0x01, (uint8_t) half});
  - platform: template
    name: "Filter interval"
    icon: mdi:air-filter
    entity_category: config
    update_interval: 10s
    options: ["180 h", "300 h", "500 h", "700 h"]
    lambda: |-
      int h = ac_cn51::filter_interval_h();
      if (h <= 0)
        return {};
      return esphome::to_string(h) + " h";
    set_action:
      - lambda: |-
          for (uint8_t i = 1; i <= 4; i++)
            if (atoi(x.c_str()) == ac_cn51::FILTER_INTERVALS_H[i])
              ac_cn51::send(id(cn51), 0x14, 0x04, {0xE9, 0x01, i});
      - delay: 2s
      - lambda: 'ac_cn51::request_counters(id(cn51));'
  - platform: template
    name: "Air direction"
    icon: mdi:arrow-decision
    update_interval: 2s
    # On this model only these two do anything (tested 2026-10-03); left/right blades are manual.
    options:
      - "Fixed"
      - "Swing up/down"
    lambda: |-
      for (auto &d : ac_cn51::DIRECTIONS)
        if (d.value == ac_cn51::state.direction)
          return std::string(d.name);
      return {};
    set_action:
      - lambda: |-
          for (auto &d : ac_cn51::DIRECTIONS)
            if (x == d.name)
              ac_cn51::command(id(cn51), 0x12, 0x63, d.value);

sensor:
  # CN51 counters are in tenths (kWh, h), as in the DPLUG integration (porech/samsung_ac_dplug).
  - platform: template
    name: "Unit energy"
    entity_category: diagnostic
    update_interval: 60s
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    lambda: 'return ac_cn51::state.used_power < 0 ? NAN : ac_cn51::state.used_power / 10.0f;'
  - platform: template
    name: "Operating time"
    entity_category: diagnostic
    update_interval: 60s
    unit_of_measurement: h
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 1
    lambda: 'return ac_cn51::state.used_time < 0 ? NAN : ac_cn51::state.used_time / 10.0f;'
  - platform: template
    name: "Filter use"
    entity_category: diagnostic
    update_interval: 60s
    unit_of_measurement: h
    device_class: duration
    state_class: measurement
    accuracy_decimals: 1
    lambda: 'return ac_cn51::state.filter_use < 0 ? NAN : ac_cn51::state.filter_use / 10.0f;'
  - platform: template
    name: "Filter life left"
    icon: mdi:air-filter
    update_interval: 60s
    unit_of_measurement: "%"
    accuracy_decimals: 0
    lambda: |-
      int total = ac_cn51::filter_interval_h();
      if (total <= 0 || ac_cn51::state.filter_use < 0)
        return NAN;
      float left = 100.0f * (1.0f - ac_cn51::state.filter_use / 10.0f / total);
      return left < 0 ? 0.0f : left;

binary_sensor:
  - platform: template
    name: "CN51 connected"
    entity_category: diagnostic
    device_class: connectivity
    lambda: 'return ac_cn51::state.last_rx_ms != 0 && millis() - ac_cn51::state.last_rx_ms < 60000;'

button:
  - platform: restart
    name: "Reboot"
